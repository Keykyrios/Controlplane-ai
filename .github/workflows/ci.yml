name: ControlPlane Manifold CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio httpx ruff

      - name: Lint with ruff
        run: ruff check services/ shared/ eval/ demo/

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      - name: Run service import tests
        run: |
          python -c "from services.orchestrator.main import app; print('orchestrator OK')"
          python -c "from services.fingerprint.main import app; print('fingerprint OK')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker-compose build --parallel

      - name: Verify services start
        run: |
          docker-compose up -d
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker-compose down
