[project]
name = "controlplane-manifold"
version = "1.0.0"
description = "A Unified Topological, Categorical, Non-Hermitian, and Information-Thermodynamic Architecture for Real-Time Risk Certification of Deployed AI Systems"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    
    # Scientific computing
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "clifford>=1.4.0",
    "networkx>=3.3",
    
    # Topological data analysis
    "giotto-tda>=0.6.0",
    "scikit-learn>=1.5.0",
    
    # Simulation & queueing
    "simpy>=4.1.0",
    
    # Cryptography
    "cryptography>=43.0.0",
    
    # Data visualization (eval harness)
    "plotly>=5.24.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.9.0",
    
    # Database
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
fhe = [
    "tenseal>=0.3.0",
]
pqc = [
    # liboqs-python — install separately via pip install liboqs-python
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*"]
